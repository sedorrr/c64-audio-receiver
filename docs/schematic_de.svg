<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860"><rect width="1180" height="860" fill="#ffffff"/><text x="30" y="40" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="bold">C64-Audioempfänger  /  Pico 2 W + PCM5102A  -  Minimalaufbau</text><text x="30" y="66" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#7f8c8d" text-anchor="start" font-weight="normal">Keine weiteren Bauteile. Signal = blau, +5 V = rot, GND = schwarz, 3,3 V = violett. Gestrichelt = optional.</text><rect x="40" y="110" width="300" height="470" rx="6" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/><text x="60" y="144" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="bold">Raspberry Pi Pico 2 W</text><text x="60" y="168" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#7f8c8d" text-anchor="start" font-weight="normal">Versorgung über USB (5-V-Ladegerät)</text><text x="326" y="225" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#c0392b" text-anchor="end" font-weight="bold">VSYS  (39)</text><circle cx="340" cy="220" r="5" fill="#c0392b"/><text x="326" y="265" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="bold">GND  (38)</text><circle cx="340" cy="260" r="5" fill="#1a1a1a"/><text x="326" y="345" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1f5fbf" text-anchor="end" font-weight="bold">GP20  (26)</text><circle cx="340" cy="340" r="5" fill="#1f5fbf"/><text x="326" y="385" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1f5fbf" text-anchor="end" font-weight="bold">GP21  (27)</text><circle cx="340" cy="380" r="5" fill="#1f5fbf"/><text x="326" y="465" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1f5fbf" text-anchor="end" font-weight="bold">GP22  (29)</text><circle cx="340" cy="460" r="5" fill="#1f5fbf"/><text x="326" y="545" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1f5fbf" text-anchor="end" font-weight="bold">GP15  (20)</text><circle cx="340" cy="540" r="5" fill="#1f5fbf"/><rect x="600" y="110" width="270" height="470" rx="6" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/><text x="618" y="144" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="bold">PCM5102A-Modul</text><text x="618" y="166" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="start" font-weight="normal">(lila Platine, 32 x 17 mm, 6-polige Leiste)</text><text x="616" y="225" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">VIN</text><circle cx="600" cy="220" r="5" fill="#c0392b"/><text x="616" y="265" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">GND</text><circle cx="600" cy="260" r="5" fill="#1a1a1a"/><text x="616" y="305" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">SCK</text><circle cx="600" cy="300" r="5" fill="#1a1a1a"/><text x="616" y="345" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">DIN</text><circle cx="600" cy="340" r="5" fill="#1f5fbf"/><text x="616" y="385" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">BCK</text><circle cx="600" cy="380" r="5" fill="#1f5fbf"/><text x="616" y="465" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">LCK</text><circle cx="600" cy="460" r="5" fill="#1f5fbf"/><text x="616" y="505" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">FLT</text><circle cx="600" cy="500" r="5" fill="#1f5fbf"/><text x="616" y="527" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">DMP</text><circle cx="600" cy="522" r="5" fill="#1f5fbf"/><text x="616" y="549" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">FMT</text><circle cx="600" cy="544" r="5" fill="#1f5fbf"/><text x="616" y="571" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">XMT</text><circle cx="600" cy="566" r="5" fill="#1f5fbf"/><text x="670" y="510" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="start" font-weight="normal">-&gt; siehe Lötbrücken</text><polyline points="340,220 470,220 470,220 600,220" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><polyline points="340,260 450,260 450,260 600,260" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><polyline points="450,260 450,300 600,300" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="260" r="5" fill="#1a1a1a"/><polyline points="340,340 430,340 430,340 600,340" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-linejoin="round"/><polyline points="340,380 410,380 410,380 600,380" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-linejoin="round"/><polyline points="340,460 410,460 410,460 600,460" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-linejoin="round"/><text x="470" y="210" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">+5 V</text><text x="380" y="332" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="normal">DIN</text><text x="380" y="372" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="normal">BCK</text><text x="380" y="452" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="normal">LRCK</text><polyline points="340,540 420,540" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="420" y="522" width="90" height="36" rx="6" fill="#fff" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="7 5"/><text x="465" y="545" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal">⏚ GND</text><text x="420" y="576" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="start" font-weight="normal">Taster (optional)</text><rect x="854" y="330" width="32" height="60" rx="4" fill="#222" stroke="#1a1a1a" stroke-width="2"/><text x="800" y="414" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="start" font-weight="normal">3,5-mm-Buchse</text><polyline points="886,360 960,360" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/><text x="1055" y="464" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle" font-weight="normal">Kabel 3,5-mm-Klinke -&gt; 2 x Cinch</text><rect x="960" y="270" width="190" height="180" rx="6" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2"/><text x="1055" y="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Stereoanlage</text><text x="1055" y="322" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal">AUX / TAPE / TUNER</text><text x="1055" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#7f8c8d" text-anchor="middle" font-weight="normal">(nicht PHONO)</text><circle cx="1000" cy="375" r="14" fill="#eee" stroke="#1a1a1a" stroke-width="2"/><circle cx="1000" cy="375" r="4" fill="#1a1a1a"/><text x="1026" y="380" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">L</text><circle cx="1000" cy="420" r="14" fill="#e74c3c" stroke="#1a1a1a" stroke-width="2"/><circle cx="1000" cy="420" r="4" fill="#1a1a1a"/><text x="1026" y="425" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">R</text><polyline points="960,360 986,375" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><polyline points="960,360 986,420" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><text x="900" y="512" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold">Lötbrücken (Rückseite des Moduls):</text><text x="905" y="536" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#7d3c98" text-anchor="start" font-weight="normal">H1L FLT  -&gt; L</text><text x="905" y="556" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#7d3c98" text-anchor="start" font-weight="normal">H2L DEMP -&gt; L</text><text x="905" y="576" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#7d3c98" text-anchor="start" font-weight="normal">H3L XSMT -&gt; H  (sonst stumm!)</text><text x="905" y="596" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#7d3c98" text-anchor="start" font-weight="normal">H4L FMT  -&gt; L  (I2S)</text><text x="40" y="640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="normal">1) VIN des Moduls an VSYS (Pin 39 = USB 5 V): der Regler auf dem Modul macht saubere 3,3 V für den DAC.</text><text x="40" y="666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="normal">2) SCK an GND (Pin oder Brücke auf der Platine): der PCM5102A erzeugt seinen Takt dann aus BCK - kein MCLK-Kabel nötig.</text><text x="40" y="692" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="normal">3) Lötbrücken offen: stattdessen die Pads 1-4 an der Längsseite (FLT, DEMP, FMT an GND, XSMT an das Pad A3V3).</text><text x="40" y="718" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="normal">4) Volle Lautstärke = 2,1 V eff., mehr als alte Line-Eingänge meist erwarten: auf der Webseite mit 50-80 % beginnen.</text><text x="40" y="744" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="normal">5) Brummen? Ladegerät ohne Schutzkontakt verwenden oder den Pico aus der USB-Buchse der Anlage versorgen.</text><text x="40" y="770" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="normal">6) GP20/21/22 stören die Pins des C64-Visualizers nicht - der Empfänger kann später in dessen Pico wandern.</text></svg>